# Palette generated by theme-switch.
source = ~/.cache/vyeos/theme/hyprlock.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = enter, 0.22, 1, 0.36, 1
    bezier = exit, 0.4, 0, 1, 1
    animation = fadeIn, 1, 3, enter
    animation = fadeOut, 1, 2, exit
    animation = inputFieldDots, 1, 2, enter
}

background {
    monitor =
    path = screenshot
    color = $bg_dim
    blur_size = 8
    blur_passes = 3
    brightness = 0.42
    contrast = 0.94
    vibrancy = 0.08
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_family = $font
    font_size = 103
    position = 0, 198
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B"
    color = $fg
    font_family = $font
    font_size = 21
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $grey2
    font_family = $font
    font_size = 15
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 413, 65
    outline_thickness = 3
    dots_size = 0.23
    dots_spacing = 0.28
    dots_center = true
    outer_color = $bg2
    inner_color = $bg0
    font_color = $fg
    check_color = $green
    fail_color = $red
    capslock_color = $yellow
    font_family = $font
    placeholder_text = Password
    check_text = Unlocking
    fail_text = $FAIL
    fade_on_empty = false
    rounding = 18
    position = 0, -110
    halign = center
    valign = center
}
