# Everforest Hard lock screen
# https://everforest.vercel.app/palette

$font = JetBrainsMono Nerd Font
$bg_dim = rgb(1e2326)
$bg0 = rgb(272e33)
$bg1 = rgb(2e383c)
$bg2 = rgb(374145)
$fg = rgb(d3c6aa)
$grey0 = rgb(7a8478)
$grey2 = rgb(9da9a0)
$red = rgb(e67e80)
$yellow = rgb(dbbc7f)
$green = rgb(a7c080)
$blue = rgb(7fbbb3)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = enter, 0.22, 1, 0.36, 1
    bezier = exit, 0.4, 0, 1, 1
    animation = fadeIn, 1, 3, enter
    animation = fadeOut, 1, 2, exit
    animation = inputFieldDots, 1, 2, enter
}

background {
    monitor =
    path = screenshot
    color = $bg_dim
    blur_size = 8
    blur_passes = 3
    brightness = 0.42
    contrast = 0.94
    vibrancy = 0.08
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_family = $font
    font_size = 103
    position = 0, 198
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B"
    color = $fg
    font_family = $font
    font_size = 21
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $grey2
    font_family = $font
    font_size = 15
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 413, 65
    outline_thickness = 3
    dots_size = 0.23
    dots_spacing = 0.28
    dots_center = true
    outer_color = $bg2
    inner_color = $bg0
    font_color = $fg
    check_color = $green
    fail_color = $red
    capslock_color = $yellow
    font_family = $font
    placeholder_text = <span foreground="##9da9a0">Password</span>
    check_text = <span foreground="##a7c080">Unlocking</span>
    fail_text = <span foreground="##e67e80">$FAIL</span>
    fade_on_empty = false
    rounding = 18
    position = 0, -110
    halign = center
    valign = center
}
