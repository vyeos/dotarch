# The GA403GM's ALC285 routes its main speakers through DAC 0x02 and its
# bass speakers through DAC 0x06. Only DAC 0x02 exposes a hardware volume
# control, so hardware volume changes the treble path while leaving bass at
# a fixed level. Scale playback in software before it reaches both DACs. Keep
# capture on the hardware mixer; applying this to the whole card makes the
# internal microphones run at full hardware gain and produces severe hiss.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_65_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
