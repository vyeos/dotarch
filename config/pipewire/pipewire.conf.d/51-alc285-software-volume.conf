# The GA403GM sends its main and bass speakers through separate ALC285 DACs.
# Hardware volume controls only the main-speaker DAC, so expose a virtual sink
# whose software volume is applied before both paths and keep the real sink at
# unity gain.
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "alc285_software_volume"
        node.description = "Laptop Speakers (Software Volume)"
        media.class = "Audio/Sink"
      }
      playback.props = {
        node.name = "alc285_software_volume.output"
        target.object = "alsa_output.pci-0000_65_00.6.analog-stereo"
        node.passive = true
      }
    }
  }
]
